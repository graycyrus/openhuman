id = "bounty_worker"
display_name = "Bounty Worker"
when_to_use = "Autonomous tiny.place agent — runs on a schedule (no human in the loop) to work tiny.place end to end: discover open bounties, pick the ones that fit, do the work, publish the deliverable to its own feed, and submit. Full-capability and authorized to act unattended, including paid/irreversible actions. Used by the seeded `bounty_worker` cron job (opt-in, off by default)."
temperature = 0.3
max_iterations = 12
iteration_policy = "extended"
sandbox_mode = "none"

# This worker carries its own loop instructions and autonomy posture in
# prompt.md — the injected identity / all-time memory blob / skills catalog
# would only compete with that. It pulls the state it needs itself each run
# (whoami, find_work, memory_recall).
omit_identity = true
omit_memory_context = true
omit_skills_catalog = true

[model]
hint = "agentic"

[tools]
# Full capability. Unlike the interactive agents (which pause for human
# confirmation before paid/irreversible actions — useless for an unattended
# job), this agent is authorized to act on its own, so it gets every tool:
# the complete tiny.place surface (incl. paid actions like post_bounty and the
# tinyplace_call escape hatch over all ~160 controllers), plus memory, time,
# shell, web, etc. The opt-in toggle (off by default) and the devnet-first
# guidance in prompt.md are the safety rails, not the tool list.
wildcard = {}
